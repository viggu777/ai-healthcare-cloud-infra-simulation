# Phase 1 base + Phase 2 hardening (cap_drop + no-new-privileges on custom services).
# P0.2: every service carries `restart: unless-stopped` — an unexpected process
# death (crash/OOM) is revived automatically; an explicit `docker stop/kill`
# stays stopped by design (management hold-down, used for the INC-01 window).
# Runtime stack: Node.js 22 + Express (MERN backend; no frontend per spec §26).
# Usage:
#   docker compose --env-file environments/dev.env up --build
#   docker compose --env-file environments/prod.env up --build
# Scale independently: --scale api=2 --scale worker=2
# Phase 2 notes:
#   - api/ai-service/worker/ehr-mock run as `node` (unprivileged, see Dockerfiles) + cap_drop ALL.
#   - gateway (nginx:alpine) intentionally left without cap_drop: master starts as root
#     to bind :80 then drops workers; official minimal image, config mounted :ro.
#   - db (mongo:7-jammy) intentionally left without cap_drop: mongod requires
#     chown/dac syscalls on first init; isolated on private internal net instead.
name: ai-healthcare-sim

networks:
  public:
    name: ${COMPOSE_PROJECT_NAME:-ai-healthcare-sim}_public
  private:
    name: ${COMPOSE_PROJECT_NAME:-ai-healthcare-sim}_private
    internal: true

volumes:
  mongodb_data:
  queue-data:
  prometheus-data:
  grafana-data:

services:
  gateway:
    # Phase 3: base image pinned by digest (closes SECURITY.md R5). Digest
    # corresponds to nginx:alpine as pulled 2026-09-19; repin on rebuild cadence.
    image: nginx:alpine@sha256:4870c12cd2ca986de501a804b4f506ad3875a0b1874940ba0a2c7f763f1855b2
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - public
    ports:
      - "${GATEWAY_PORT:-8080}:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  api:
    build: ./services/api
    image: ai-healthcare/api:${APP_VERSION:-0.1.0}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy
      queue:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - public
      - private
    environment:
      APP_VERSION: ${APP_VERSION:-0.1.0}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MONGODB_URI: mongodb://${MONGO_USER:-app}:${MONGO_PASSWORD:-app_secret_change_me}@db:27017/${MONGO_DB:-healthcare}?authSource=admin
      MONGO_DB: ${MONGO_DB:-healthcare}
      REDIS_URL: redis://queue:6379/0
      AI_SERVICE_URL: http://ai-service:8001
      AI_API_KEY: ${AI_API_KEY:-dev_ai_key_change_me}
      EHR_URL: http://ehr-mock:8002
      EHR_TIMEOUT_S: ${EHR_TIMEOUT_S:-3}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:8000/health',{signal:AbortSignal.timeout(3000)}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  ai-service:
    build: ./services/ai-service
    image: ai-healthcare/ai-service:${APP_VERSION:-0.1.0}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - private
    environment:
      AI_API_KEY: ${AI_API_KEY:-dev_ai_key_change_me}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:8001/health',{signal:AbortSignal.timeout(3000)}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  worker:
    build: ./services/worker
    image: ai-healthcare/worker:${APP_VERSION:-0.1.0}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy
      queue:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - private
    environment:
      MONGODB_URI: mongodb://${MONGO_USER:-app}:${MONGO_PASSWORD:-app_secret_change_me}@db:27017/${MONGO_DB:-healthcare}?authSource=admin
      MONGO_DB: ${MONGO_DB:-healthcare}
      REDIS_URL: redis://queue:6379/0
      EHR_URL: http://ehr-mock:8002
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      WORKER_FAIL_MODE: ${WORKER_FAIL_MODE:-off}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:8003/health',{signal:AbortSignal.timeout(3000)}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  queue:
    # Phase 3: pinned by digest (see gateway note).
    image: redis:7-alpine@sha256:520775a41a63e77e06c73e35d2fd9cc15921a609516818796b4ecbb813078bc7
    command: ["redis-server", "--appendonly", "yes"]
    # Phase 2 note: cap_drop ALL removed — redis:7-alpine entrypoint needs
    # chown/setuid on /data (verified: fails with "Permission denied" on
    # appendonlydir). Isolated on private internal net instead; revisit with
    # explicit cap_add (CHOWN, SETGID, SETUID) in Phase 3.
    restart: unless-stopped
    networks:
      - private
    volumes:
      - queue-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  db:
    # Phase 3: pinned by digest (see gateway note).
    image: mongo:7-jammy@sha256:84c4a18b60a0e73d1577112b0a600b46cab477c64cfe0ff36d0647bbca055bd0
    restart: unless-stopped
    networks:
      - private
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-app}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-app_secret_change_me}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-healthcare}
    volumes:
      - mongodb_data:/data/db
      - ./db/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand(\"ping\")' || mongosh --quiet -u \"$${MONGO_INITDB_ROOT_USERNAME}\" -p \"$${MONGO_INITDB_ROOT_PASSWORD}\" --eval 'db.adminCommand(\"ping\")'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  ehr-mock:
    build: ./services/ehr-mock
    image: ai-healthcare/ehr-mock:${APP_VERSION:-0.1.0}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - private
    environment:
      EHR_MODE: ${EHR_MODE:-ok}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:8002/health',{signal:AbortSignal.timeout(3000)}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---- Phase 4 observability (all on `private`, none publicly reachable) ----
  # Prometheus/Grafana are admin-only: no LAN/internet exposure. Grafana's port
  # is bound to 127.0.0.1 (host-local admin access, a documented compose-lint
  # exception); everything else is reachable only inside the private network.
  prometheus:
    # Phase 4: pinned by digest (see gateway note).
    image: prom/prometheus:v3.6.0@sha256:76947e7ef22f8a698fc638f706685909be425dbe09bd7a2cd7aca849f79b5f64
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=1GB
    restart: unless-stopped
    networks:
      - private
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus

  alertmanager:
    # Phase 4: pinned by digest (see gateway note).
    image: prom/alertmanager:v0.28.0@sha256:d5155cfac40a6d9250ffc97c19db2c5e190c7bc57c6b67125c94903358f8c7d8
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    restart: unless-stopped
    networks:
      - private
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    depends_on:
      - prometheus

  pushgateway:
    # Phase 4: pinned by digest (see gateway note). Receives pipeline/security
    # status pushes (scripts/pipeline.sh pushes via the api container, the only
    # path from the host onto the private net); scraped by Prometheus.
    image: prom/pushgateway:v1.10.0@sha256:7a4d0696a24ef4e8bad62bee5656855a0aff2f26416d8cb32009dc28d6263604
    restart: unless-stopped
    networks:
      - private

  grafana:
    # Phase 4: pinned by digest (see gateway note).
    # Dual-net like `api`: a container attached ONLY to the `internal:true`
    # private net cannot publish ports at all (Docker silently drops the
    # binding — verified 2026-09-19). Public-net adjacency makes the
    # localhost-bound admin port materialize; the port itself stays
    # 127.0.0.1-bound (host admin only, never LAN/internet, never via gateway).
    image: grafana/grafana:11.6.0@sha256:62d2b9d20a19714ebfe48d1bb405086081bc602aa053e28cf6d73c7537640dfb
    restart: unless-stopped
    networks:
      - public
      - private
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin_only_change_me}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

  redis-exporter:
    # Phase 4: pinned by digest (see gateway note).
    image: oliver006/redis_exporter:v1.68.0@sha256:e7e96895407ae28cf28dc97c73c9cd958c5adb4746120e2664569393436c1bd0
    restart: unless-stopped
    networks:
      - private
    environment:
      REDIS_ADDR: redis://queue:6379
    depends_on:
      queue:
        condition: service_healthy

  mongodb-exporter:
    # Phase 4: pinned by digest (see gateway note).
    image: percona/mongodb_exporter:0.40.0@sha256:d66daa6aff0513860d1577cee3b55ab82fde43394f8319d7b4674411b9153cce
    restart: unless-stopped
    networks:
      - private
    environment:
      MONGODB_URI: mongodb://${MONGO_USER:-app}:${MONGO_PASSWORD:-app_secret_change_me}@db:27017/admin?authSource=admin
    depends_on:
      db:
        condition: service_healthy

  nginx-exporter:
    # Phase 4: pinned by digest (see gateway note).
    # Dual-net like `api`: it must reach gateway:80 (gateway is intentionally
    # public-only, so a private-only exporter cannot resolve it) while being
    # scraped by Prometheus on `private`. No published ports.
    image: nginx/nginx-prometheus-exporter:1.4.2@sha256:6edfb73afd11f2d83ea4e8007f5068c3ffaa38078a6b0ad1339e5bd2f637aacd
    command:
      - -nginx.scrape-uri=http://gateway:80/nginx_status
    restart: unless-stopped
    networks:
      - public
      - private
    depends_on:
      - gateway
