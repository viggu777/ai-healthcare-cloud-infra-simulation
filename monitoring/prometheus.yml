# Phase 4 — Prometheus scrape config (as code, version-controlled).
# All targets live on the Compose `private` network (internal:true); Prometheus
# itself is on `private` with NO published host port (admin reads via Grafana on
# its localhost-bound port, or `docker compose exec prometheus ...`).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'api'
    static_configs:
      - targets: ['api:8000']
    metrics_path: /metrics/prom

  - job_name: 'worker'
    static_configs:
      - targets: ['worker:8003']
    metrics_path: /metrics/prom

  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx-exporter:9113']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']

  - job_name: 'mongodb'
    static_configs:
      - targets: ['mongodb-exporter:9216']

  - job_name: 'pushgateway'
    static_configs:
      - targets: ['pushgateway:9091']
    honor_labels: true
