# Phase 4 — Alertmanager config (as code). Simulation-grade receiver: alerts are
# evaluated and visible (Alertmanager API + Prometheus ALERTS metric + Grafana
# panel). There is no mail/SMS in this free local stack, so notifications go to
# a discard webhook — in a real cloud this receiver becomes PagerDuty/email/Slack.
global: {}

route:
  receiver: 'blackhole'
  group_by: ['alertname']
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 1h

receivers:
  - name: 'blackhole'
    webhook_configs:
      - url: 'http://127.0.0.1:9/'
        send_resolved: false
