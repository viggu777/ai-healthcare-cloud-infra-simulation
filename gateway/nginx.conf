# P1.1: basic rate limiting (this file is included inside the http context).
# 20 r/s sustained per client IP, bursts of 20 extra served without delay,
# anything beyond gets 429. Sized so normal traffic (smoke/k6 scenarios,
# health gates) never trips it, while a k6 burst (k6/burst.js) visibly does.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
# Shed load with 429 (not nginx's default 503) so clients can tell
# "slow down" apart from "broken".
limit_req_status 429;

# Dynamic upstream resolution (fixes RESILIENCE.md §4 static-DNS skew).
# The embedded Docker DNS (127.0.0.11) is queried per-request via the
# variable form of proxy_pass, so `docker compose up --scale api=N`
# actually spreads load instead of pinning to the first IP resolved
# at startup. NOTE: variable proxy_pass bypasses any `upstream {}` block
# by design — failover is via proxy_next_upstream below, not max_fails.
resolver 127.0.0.11 valid=10s ipv6=off;
server {
  listen 80;
  # P1.1: self-signed TLS (local simulation cert from scripts/gen-gateway-cert.sh,
  # mounted at /etc/nginx/tls; HTTPS serves the same routes as :80).
  listen 443 ssl;
  ssl_certificate /etc/nginx/tls/gateway.crt;
  ssl_certificate_key /etc/nginx/tls/gateway.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  # Per-request upstream variable (evaluated after resolver).
  set $api_upstream api:8000;
  location /health {
    proxy_pass http://$api_upstream/health;
    proxy_connect_timeout 3s;
    proxy_read_timeout 5s;
  }
  # P1.1: static gateway-liveness endpoint (does not touch any upstream).
  location = /nginx-health {
    access_log off;
    add_header Content-Type application/json;
    return 200 '{"status":"ok","service":"gateway"}';
  }
  # Phase 4: stub_status for the nginx-prometheus-exporter (internal only).
  # Not proxied to any upstream and unreachable from outside: the gateway only
  # publishes :80 to the host, and this path is allow-listed to RFC1918/localhost
  # so only in-cluster scrapers (and the host admin) can read it.
  location /nginx_status {
    stub_status;
    allow 127.0.0.1;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;
  }
  location / {
    # P1.1: rate-limit the API catch-all (health/exporter paths above are exempt).
    limit_req zone=api_limit burst=20 nodelay;
    proxy_pass http://$api_upstream;
    proxy_next_upstream error timeout http_502 http_503;
    proxy_next_upstream_tries 2;
    proxy_connect_timeout 5s;
    proxy_read_timeout 10s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Keepalive to upstream (variable form still reuses connections).
    proxy_http_version 1.1;
    proxy_set_header Connection "";
  }
}
