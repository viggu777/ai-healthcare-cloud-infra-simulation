upstream api {
  server api:8000 max_fails=3 fail_timeout=10s;
}
server {
  listen 80;
  location /health {
    proxy_pass http://api/health;
    proxy_connect_timeout 3s;
    proxy_read_timeout 5s;
  }
  # Phase 4: stub_status for the nginx-prometheus-exporter (internal only).
  # Not proxied to any upstream and unreachable from outside: the gateway only
  # publishes :80 to the host, and this path is allow-listed to RFC1918/localhost
  # so only in-cluster scrapers (and the host admin) can read it.
  location /nginx_status {
    stub_status;
    allow 127.0.0.1;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;
  }
  location / {
    proxy_pass http://api;
    proxy_connect_timeout 5s;
    proxy_read_timeout 10s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
